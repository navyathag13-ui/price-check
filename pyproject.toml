[project]
name = "pricecheck"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests", "pyyaml", "ijson", "pydantic"]

[project.optional-dependencies]
dev = [
    "pytest", "hypothesis",
    "pyarrow", "pandas", "numpy",
    "duckdb", "deltalake",
    "rapidfuzz", "faiss-cpu", "scikit-learn", "joblib",
    "openai", "python-dotenv",
    "fastapi", "httpx", "uvicorn[standard]", "strawberry-graphql", "pymssql",
    "psutil",
    "ruff",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 145
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E702", "E741", "E731"]  # E501: long SQL/comments; E702: deliberate compact one-line asserts in tests;
# E741: `l` used throughout as the loop var for jsonl lines; E731: a couple of lambda helpers in test files
