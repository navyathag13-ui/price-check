name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests scripts dashboard
      - name: Unit + property tests
        # No raw bronze data in the repo (multi-GB, gitignored) -- every data-dependent test skips cleanly
        # rather than failing; see tests/test_contracts.py and DECISIONS.md for how that's guaranteed.
        run: pytest -q tests --junitxml=pytest-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml

  dbt-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dbt
        run: pip install dbt-core dbt-duckdb
      - name: Build tiny synthetic Delta/parquet fixtures
        # CI has no real 41M-row history table (that's local-only, multi-GB). This builds a small but REAL Delta
        # table + parquet files with the same schema so `dbt build` runs against real (if synthetic) data, not
        # a mock -- every dbt test that can meaningfully run, does.
        run: |
          pip install -e . deltalake pyarrow
          mkdir -p data/gold
          python scripts/ci_fixtures.py
      - name: dbt deps
        working-directory: dbt/pricecheck
        run: dbt deps
      - name: dbt build (against CI fixtures)
        working-directory: dbt/pricecheck
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/profiles
          DBT_DUCKDB_PATH: ${{ github.workspace }}/data/gold/pricecheck_ci.duckdb
          PRICE_HISTORY_PATH: ${{ github.workspace }}/data/ci_fixtures/price_history
          QUALITY_SCORES_PATH: ${{ github.workspace }}/data/ci_fixtures/quality_scores
          ANOMALY_FLAGS_PATH: ${{ github.workspace }}/data/ci_fixtures/flags.parquet
          HOSPITAL_REGISTRY_PATH: ${{ github.workspace }}/data/ci_fixtures/hospitals.csv
        run: dbt build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: terraform init (no backend, validate only)
        working-directory: terraform
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: terraform
        run: terraform validate
      # terraform plan/apply needs real Azure credentials (a service principal) and is NOT run in CI --
      # this org's Azure tenant blocks non-interactive CLI auth from outside its own portal/Cloud Shell
      # (see DECISIONS.md ADR-022 and sql/azure_sql/README.md for the same constraint hit elsewhere in this
      # project). `terraform plan` is a documented manual step, not an automated one, until that's resolved.
